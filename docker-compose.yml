version: '3.8'

services:
  # ── PostgreSQL Database ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: qrs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qrs_db
      POSTGRES_USER: qrs_user
      POSTGRES_PASSWORD: qrs_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrs_user -d qrs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: qrs_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI Query Resolution System
      - DEBUG=false
      - SQLALCHEMY_DATABASE_URL=postgresql://qrs_user:qrs_password123@postgres:5432/qrs_db
      - JWT_SECRET_KEY=super-secret-change-me-in-production-abc123xyz
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_CHAT_MODEL=llama3.1
      - CHROMA_MODE=local
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - CHROMA_COLLECTION_NAME=document_chunks
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=64
      - RETRIEVAL_TOP_K=5
      - SIMILARITY_THRESHOLD=0.5
      - MAX_UPLOAD_SIZE_MB=50
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    volumes:
      - chroma_data:/app/chroma_data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  # ── React + Vite Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: qrs_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ── Ollama (Local LLM) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: qrs_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  chroma_data:
  ollama_data:

